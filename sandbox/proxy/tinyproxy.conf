User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
LogLevel Notice
MaxClients 64

# Only the internal compose network can reach the proxy.
Allow 0.0.0.0/0

# Deny everything not matching the allowlist; match hosts, not full URLs.
FilterType fnmatch
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes

# CONNECT (TLS) is limited to HTTPS.
ConnectPort 443
