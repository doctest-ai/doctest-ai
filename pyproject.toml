[project]
name = "doctest-ai"
version = "0.2.0"
description = "A pytest plugin that measures how much your docs contribute to AI coding agent success."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Framework :: Pytest",
]
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic-settings>=2.3.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
bdd = ["pytest-bdd>=8.1.0"]

[project.scripts]
doctest-ai = "doctest_ai:main"

[project.entry-points.pytest11]
doctest-ai = "doctest_ai.plugin"

[dependency-groups]
dev = ["pytest-bdd>=8.1.0"]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"
